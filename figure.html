<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Figure for the report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* The three main charts of the prototype in one row, for printing to PDF:
       Chrome, Print, Save as PDF (or --headless --print-to-pdf). */
    @page { size: 1540px 480px; margin: 0; }
    body { background: var(--surface); }
    .row { display: grid; grid-template-columns: 481px 481px 541px; gap: 16px; padding: 10px; width: 1520px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="row">
    <div id="trend"></div>
    <div id="outliers"></div>
    <div id="matrix"></div>
  </div>

  <!-- The views expect these elements; the figure does not show them. -->
  <div class="hidden">
    <input id="quarter" type="range" min="0" step="1"><output id="quarter-label"></output>
    <input id="min-holders" type="range" min="5" max="20" step="1"><output id="min-holders-label"></output>
    <div id="chips"></div>
    <div id="ranking"></div>
    <div id="history"></div><span id="history-caption"></span>
    <div id="neighbours"></div><span id="neighbours-caption"></span>
  </div>

  <script src="lib/d3.v7.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/consensus.js"></script>
  <script src="js/moves.js"></script>
  <script src="js/similarity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
